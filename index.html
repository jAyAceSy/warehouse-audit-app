<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#EEF1F7; --frame-bg:#F6F8FC; --card:#FFFFFF; --border:#E1E6F0;
    --navy-900:#0F1B33; --navy-800:#142A52; --navy-700:#1B3568;
    --blue-600:#2F5FE0; --blue-050:#E8EEFF;
    --red-500:#E0453F; --red-050:#FCE9E8;
    --orange-500:#EF8B3B; --orange-050:#FDEEE0;
    --amber-400:#EFB223; --amber-050:#FCF3DD;
    --green-600:#1D9A62; --green-050:#E4F6ED;
    --purple-600:#8B5CF6; --purple-050:#F2EAFE;
    --text-900:#12182B; --text-600:#5B6478; --text-400:#98A0B3;
    --radius-l:18px; --radius-m:12px; --radius-s:8px;
    --shadow-card:0 1px 2px rgba(15,27,51,.04), 0 8px 20px -12px rgba(15,27,51,.12);
  }
  *{box-sizing:border-box;}
  svg{width:20px;height:20px;flex-shrink:0;vertical-align:middle;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text-900);-webkit-font-smoothing:antialiased;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app-wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--frame-bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(15,27,51,.08);}
  .topbar{background:var(--navy-900);color:#fff;padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .topbar .left{display:flex;align-items:center;gap:12px;}
  .icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;position:relative;transition:background .15s ease;}
  .icon-btn:hover{background:rgba(255,255,255,.16);}
  .badge-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red-500);border:1.5px solid var(--navy-900);}

  .signout-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);padding:8px 12px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;}
  .signout-btn svg{width:15px;height:15px;}

  .role-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:#9AA6C6;font-weight:600;margin-top:1px;}
  .role-chip{background:rgba(255,255,255,.1);padding:2px 7px;border-radius:999px;font-weight:700;color:#D9E0F5;}

  .content{flex:1;padding:16px 16px 96px;overflow-y:auto;}
  .content::-webkit-scrollbar{display:none;}

  .bottomnav{position:sticky;bottom:0;display:flex;background:var(--navy-900);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:10px;color:#8E9AC0;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;}
  .navitem.active{color:#fff;background:rgba(255,255,255,.08);}
  .navitem svg{width:21px;height:21px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-l);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  .card-title{font-size:12.5px;color:var(--text-600);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  label.field-label{font-size:12px;color:var(--text-600);font-weight:600;display:block;margin-bottom:6px;}

  .date-field{width:100%;border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;color:var(--text-900);background:#fff;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}

  .checklist-progress-track{height:7px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:10px;}
  .checklist-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue-600),#5C8CFF);border-radius:999px;transition:width .3s ease;}
  .checklist-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .checklist-item:last-child{border-bottom:none;}
  .status-icon{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .status-icon svg{width:15px;height:15px;}
  .status-good{background:var(--green-050);color:var(--green-600);}
  .status-issue{background:var(--red-050);color:var(--red-500);}
  .status-warning{background:var(--orange-050);color:var(--orange-500);}
  .status-unchecked{background:#fff;border:2px solid var(--border);}
  .ci-name{font-weight:600;font-size:14.5px;}
  .ci-sub{font-size:12.5px;margin-top:1px;}
  .ci-sub.good{color:var(--green-600);}
  .ci-sub.issue{color:var(--red-500);}
  .ci-sub.warning{color:var(--orange-500);}
  .ci-sub.unchecked{color:var(--text-400);}
  .chevron{margin-left:auto;color:var(--text-400);flex-shrink:0;}
  .admin-edit-btn{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--blue-050);color:var(--blue-600);border:none;cursor:pointer;}

  .btn-primary{width:100%;background:var(--navy-900);color:#fff;border:none;border-radius:var(--radius-m);padding:14px;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;}
  .btn-primary:active{background:var(--navy-700);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text-900);border-radius:var(--radius-m);padding:13px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;}
  .btn-danger{width:100%;background:var(--red-050);color:var(--red-500);border:1px solid #F3C7C5;border-radius:var(--radius-m);padding:13px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
  .section-head h2{font-size:15px;margin:0;font-weight:700;}
  .link-btn{background:none;border:none;color:var(--blue-600);font-weight:700;font-size:13px;cursor:pointer;padding:0;}

  .finding-card{display:flex;gap:12px;margin-bottom:12px;cursor:pointer;border-left:4px solid var(--border);}
  .finding-thumb{width:56px;height:56px;border-radius:var(--radius-s);object-fit:cover;flex-shrink:0;background:#dfe4ee;}
  .finding-info{flex:1;min-width:0;}
  .finding-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .sev-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .finding-area{font-size:12.5px;color:var(--text-600);margin-top:1px;}
  .finding-time{font-size:11.5px;color:var(--text-400);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sev-chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;height:fit-content;}
  .sev-High{background:var(--red-050);color:var(--red-500);}
  .sev-Medium{background:var(--orange-050);color:var(--orange-500);}
  .sev-Low{background:var(--amber-050);color:#A67910;}

  .due-pill{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
  .due-overdue{background:var(--red-050);color:var(--red-500);}
  .due-dueToday{background:var(--orange-050);color:var(--orange-500);}
  .due-upcoming{background:var(--bg);color:var(--text-600);}
  .due-completed{background:var(--green-050);color:var(--green-600);}

  .segmented{display:flex;background:var(--navy-900);border-radius:12px;padding:4px;margin-bottom:16px;}
  .segmented button{flex:1;border:none;background:transparent;color:#9AA6C6;font-weight:700;font-size:13.5px;padding:10px;border-radius:9px;cursor:pointer;font-family:'Inter';}
  .segmented button.active{background:#fff;color:var(--navy-900);}
  .filter-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);background:#fff;border-radius:var(--radius-m);padding:12px 14px;margin-bottom:16px;font-weight:600;font-size:14px;}
  .report-card{display:flex;gap:12px;align-items:center;cursor:pointer;}
  .report-icon{width:42px;height:42px;border-radius:10px;background:var(--blue-050);color:var(--blue-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .report-icon svg{width:20px;height:20px;}
  .report-date{font-weight:700;font-size:14.5px;}
  .report-sub{font-size:12.5px;color:var(--text-600);margin-top:2px;}

  .stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;}
  .stat-grid-3 .num{font-family:'Space Grotesk';font-weight:700;font-size:22px;}
  .stat-grid-3 .lbl{font-size:12px;color:var(--text-600);font-weight:600;margin-top:2px;}
  .stat-grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center;}
  .stat-grid-4 .num{font-family:'Space Grotesk';font-weight:700;font-size:19px;}
  .stat-grid-4 .lbl{font-size:11px;color:var(--text-600);font-weight:600;margin-top:2px;}
  .stat-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center;}

  .kv-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--text-600);font-weight:600;}
  .kv-row .v{font-weight:700;color:var(--text-900);}

  .sev-legend-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;font-weight:600;}
  .sev-legend-row .pct{margin-left:auto;color:var(--text-600);font-weight:700;}

  .export-row{display:flex;gap:10px;}
  .export-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-m);padding:13px;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid;}
  .export-pdf{border-color:#F3C7C5;color:var(--red-500);background:var(--red-050);}
  .export-xlsx{border-color:#BFE3CE;color:var(--green-600);background:var(--green-050);}

  .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ov-cell{background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;display:flex;align-items:center;gap:10px;}
  .ov-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ov-icon svg{width:19px;height:19px;}
  .ov-num{font-family:'Space Grotesk';font-weight:700;font-size:19px;line-height:1.1;}
  .ov-lbl{font-size:11.5px;color:var(--text-600);font-weight:600;}

  .area-bar-row{margin-bottom:12px;}
  .area-bar-row:last-child{margin-bottom:0;}
  .area-bar-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px;}
  .area-bar-track{height:9px;background:var(--border);border-radius:999px;overflow:hidden;}
  .area-bar-fill{height:100%;background:var(--blue-600);border-radius:999px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-overlay.open{display:flex;}
  .modal-sheet{background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .22s ease;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:16.5px;font-weight:700;}
  .modal-close{background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-600);flex-shrink:0;}

  .upload-choice-row{display:flex;gap:10px;margin-bottom:16px;}
  .upload-choice{flex:1;border:1px dashed var(--border);border-radius:var(--radius-m);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--blue-600);cursor:pointer;background:var(--blue-050);}
  .upload-choice svg{width:22px;height:22px;}
  .preview-box{position:relative;width:100%;height:150px;border-radius:var(--radius-m);overflow:hidden;margin-bottom:16px;background:#dfe4ee;}
  .preview-box img{width:100%;height:100%;object-fit:cover;}
  .preview-remove{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(15,20,40,.6);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .empty-preview{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-400);font-size:12.5px;gap:6px;}

  .text-input, .select-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;font-size:14px;font-family:'Inter';color:var(--text-900);background:#fff;}
  .field-block{margin-bottom:14px;}

  .sev-picker{display:flex;gap:8px;}
  .sev-opt{flex:1;padding:10px;border-radius:var(--radius-m);border:1.5px solid var(--border);text-align:center;font-weight:700;font-size:13px;cursor:pointer;color:var(--text-600);}
  .sev-opt.sel-High.selected{border-color:var(--red-500);background:var(--red-050);color:var(--red-500);}
  .sev-opt.sel-Medium.selected{border-color:var(--orange-500);background:var(--orange-050);color:var(--orange-500);}
  .sev-opt.sel-Low.selected{border-color:var(--amber-400);background:var(--amber-050);color:#A67910;}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .lock-note{display:flex;gap:8px;align-items:flex-start;background:var(--blue-050);color:var(--blue-600);border-radius:var(--radius-m);padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.4;}
  .lock-note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}

  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut-canvas-box{position:relative;width:118px;height:118px;flex-shrink:0;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-center .n{font-family:'Space Grotesk';font-weight:700;font-size:24px;}
  .donut-center .l{font-size:10.5px;color:var(--text-600);font-weight:600;}

  input[type=date]{font-family:'Space Grotesk';}

  .tile-row{display:flex;gap:10px;margin-bottom:14px;}
  .tile-field{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;box-shadow:var(--shadow-card);}
  .tile-field svg{width:22px;height:22px;color:var(--navy-800);}
  .tile-field .tile-label{font-size:10.5px;color:var(--text-400);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .tile-field .tile-value{font-size:12.5px;font-weight:700;color:var(--text-900);text-align:center;}

  .floor-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:0 12px 30px -8px rgba(15,27,51,.25);z-index:25;overflow:hidden;}
  .floor-dropdown-item{display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text-900);}
  .floor-dropdown-item:last-child{border-bottom:none;}
  .floor-dropdown-item:hover{background:var(--blue-050);}
  .floor-dropdown-item svg{width:15px;height:15px;color:var(--blue-600);flex-shrink:0;}

  .notif-panel{position:absolute;top:60px;right:14px;width:270px;background:#fff;border-radius:var(--radius-m);box-shadow:0 16px 40px -10px rgba(15,27,51,.3);border:1px solid var(--border);z-index:31;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .18s ease;}
  .notif-panel.open{opacity:1;transform:translateY(0);pointer-events:auto;}
  .notif-head{padding:12px 14px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--border);color:var(--text-900);}
  .notif-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:9px;align-items:flex-start;}
  .notif-item:last-child{border-bottom:none;}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--blue-600);margin-top:5px;flex-shrink:0;}
  .notif-text{font-size:12.5px;font-weight:600;color:var(--text-900);line-height:1.35;}
  .notif-time{font-size:11px;color:var(--text-400);margin-top:2px;font-weight:600;}

  .action-tile-row{display:flex;gap:10px;margin-bottom:20px;}
  .action-tile{flex:1;border:none;border-radius:var(--radius-m);padding:18px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Inter';font-size:12px;font-weight:700;color:#fff;}
  .action-tile svg{width:24px;height:24px;}
  .action-tile.tile-checklist{background:var(--blue-600);}
  .action-tile.tile-finding{background:var(--navy-900);}

  .home-greeting-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
  .home-greeting h2{font-family:'Space Grotesk';font-size:19px;margin:0 0 3px;font-weight:700;}
  .home-greeting p{margin:0;font-size:12.5px;color:var(--text-600);font-weight:600;}
  .home-warehouse-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-card);white-space:nowrap;position:relative;flex-shrink:0;}
  .home-warehouse-chip svg{width:15px;height:15px;color:var(--navy-800);}

  .progress-card{display:flex;align-items:center;gap:14px;}
  .progress-card-main{flex:1;}
  .progress-card-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:10px;}
  .progress-card-title svg{width:17px;height:17px;color:var(--blue-600);}
  .progress-pct{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--blue-600);margin-left:auto;}
  .progress-card-icon{width:52px;height:52px;border-radius:14px;background:var(--blue-050);color:var(--blue-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .progress-card-icon svg{width:26px;height:26px;}
  .progress-empty-note{font-size:12px;color:var(--text-400);font-weight:600;margin-top:8px;}

  .stat-tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  .stat-tile{background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;box-shadow:var(--shadow-card);}
  .stat-tile-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .stat-tile-icon svg{width:17px;height:17px;}
  .stat-tile .num{font-family:'Space Grotesk';font-weight:700;font-size:20px;}
  .stat-tile .lbl{font-size:11.5px;color:var(--text-600);font-weight:600;}

  .qa-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}

  .priority-banner-btn{background:none;border:none;color:var(--blue-600);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;}

  .home-fab{position:absolute;right:18px;bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--blue-600);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(47,95,224,.55);cursor:pointer;z-index:15;}

  @media (min-width:768px){

  .res-banner.verified{background:var(--green-050);color:#186B45;border:1px solid #BFE3CE;}

  .resolution-pill.pending{background:var(--orange-050);color:var(--orange-500);}
  .resolution-pill.verified{background:var(--green-050);color:var(--green-600);}

  .before-after-row{display:flex;gap:8px;margin-bottom:16px;}

  ================================================================ */
  @media (min-width:768px){

    .home-two-col{gap:20px;}

    .action-tile-row{gap:16px;}
    .filter-chip-row{flex-wrap:wrap;overflow-x:visible;}

  }

<script>

/* ---------- Authentication: real per-person accounts, role sourced from the database, not chosen by the user ---------- */
function initAuthListener(){
  auth.onAuthStateChanged(user=>{
    if(user){
      state.uid=user.uid;
      state.email=user.email;
      subscribeToMyRole(user.uid);
    }else{
      stopPresenceHeartbeat();
      detachAllDataListeners();
      state.uid=null; state.email=''; state.role=null; state.username='';
      state.authChecking=false;
      state.tab='welcome'; state.welcomeStep='login';
      render();
    }
  });
}
let bootstrappingInProgress=false;
function subscribeToMyRole(uid){
  if(myRoleRef) myRoleRef.off();
  myRoleRef=refs.userRoles.child(uid);
  myRoleRef.on('value', async snap=>{
    const rec=snap.val();
    if(!rec || rec.active===false){
      if(bootstrappingInProgress) return; // the role record is mid-write for a brand-new account; ignore this transient empty read
      const wasIn=!!state.role;
      state.role=null;
      state.authChecking=false;
      if(wasIn) toast(rec ? 'Your account has been deactivated. Contact your Admin.' : 'No role assigned to your account yet. Contact your Admin.');
      auth.signOut();
      return;
    }
    state.username=rec.name||state.email;
    state.role=rec.role;
    state.authChecking=false;
    startPresenceHeartbeat(uid);
    if(!appDataLoaded){
      appDataLoaded=true;
      logActivity('Login', `Signed in as ${rec.role}`);
      await loadPersistedData();
      state.tab = state.role==='resolver' ? 'dashboard' : 'audit';
    }
    render();
  }, err=>{
    console.error('role listener failed',err);
    state.authChecking=false;
  });
}
function detachAllDataListeners(){
  if(myRoleRef){ myRoleRef.off(); myRoleRef=null; }
  if(!listenersAttached) return;
  ['findings','reports','checklists','floorLastSubmitted','users','userRoles','activityLog','archiveFindings','archiveReports','titleTemplates','staffByFloor','pendingStaff'].forEach(k=>{
    if(refs[k]) refs[k].off();
  });
  listenersAttached=false;
  appDataLoaded=false;
}

async function bootstrapFirstAdmin(name,email,password){
  // Security Rules only allow this write while the userRoles tree is completely empty — see the shared rules doc.
  bootstrappingInProgress=true;
  try{

    await refs.userRoles.child(cred.user.uid).set({name,email,role:'admin',active:true,createdAt:Date.now(),createdBy:'bootstrap'});

    return cred;
  } finally {

}

function friendlyFirebaseError(e){
  console.error('Firebase error:', e);
  const code=(e && (e.code||e.message)||'').toLowerCase();
  if(code.includes('operation-not-allowed')) return 'Email/Password sign-in isn\'t turned on yet — enable it in Firebase Console → Authentication → Sign-in method.';
  if(code.includes('permission-denied')||code.includes('permission_denied')) return 'Permission denied — either your account doesn\'t have access, or the Security Rules haven\'t been published yet.';
  if(code.includes('email-already-in-use')) return 'That email already has an account.';
  if(code.includes('weak-password')) return 'Password is too weak — use at least 6 characters.';
  if(code.includes('invalid-email')) return 'That doesn\'t look like a valid email address.';
  if(code.includes('user-disabled')) return 'This account has been disabled in Firebase Authentication.';
  if(code.includes('user-not-found')||code.includes('wrong-password')||code.includes('invalid-credential')||code.includes('invalid-login-credentials')) return 'Incorrect email or password.';
  if(code.includes('too-many-requests')) return 'Too many attempts — please wait a moment and try again.';
  if(code.includes('unauthorized-domain')) return 'This web address isn\'t in Firebase\'s authorized domains list yet — add it under Authentication → Settings → Authorized domains.';
  if(code.includes('configuration-not-found')) return 'Email/Password sign-in isn\'t turned on yet — enable it in Firebase Console → Authentication → Sign-in method.';
  if(code.includes('network')||!navigator.onLine) return 'You appear to be offline — changes will sync once you\'re back online.';
  return `Something went wrong${e&&e.code?` (${e.code})`:''} — open the browser console for details.`;
}

/* ---------- One-time migration from the old single-blob schema ---------- */
function migrateLegacyDataIfNeeded(){
  return refs.root.once('value').then(snap=>{
    const data=snap.val()||{};
    const updates={};
    const hasLegacyArrays = Array.isArray(data.findings) || Array.isArray(data.reports);
    if(hasLegacyArrays){
      const findingsObj={}; (data.findings||[]).forEach(f=>{ findingsObj[String(f.id)]=f; });
      const reportsObj={}; (data.reports||[]).forEach(r=>{ reportsObj[String(r.id)]=r; });
      updates[`${DB_PATH}/findings`]=findingsObj;
      updates[`${DB_PATH}/reports`]=reportsObj;
      updates[`${DB_PATH}/checklistsByFloor`]=data.checklistsByFloor||{};
      updates[`${DB_PATH}/floorLastSubmitted`]=data.floorLastSubmitted||{};
    }
    if(Object.keys(updates).length===0) return;
    return db.ref().update(updates);
  }).catch(e=>console.error('Migration/appKey check failed',e));
}

/* ---------- Live subscriptions — each collection updates independently ---------- */
function objMapToArray(obj){ return obj ? Object.values(obj) : []; }

function subscribeToFindings(){
  refs.findings.on('value',snap=>{

  });
}
function subscribeToReports(){
  refs.reports.on('value',snap=>{
    state.reports=objMapToArray(snap.val()).sort((a,b)=>b.id-a.id);
    rerenderIfIdle();
  });
}
function subscribeToChecklists(){
  refs.checklists.on('value',snap=>{
    const data=snap.val();
    if(data) state.checklistsByFloor=data;
    rerenderIfIdle();
  });
}
function subscribeToFloorLastSubmitted(){
  refs.floorLastSubmitted.on('value',snap=>{
    state.floorLastSubmitted=snap.val()||{};
    rerenderIfIdle();
  });
}
function rerenderIfIdle(){
  const modalOpen=document.getElementById('modalOverlay').classList.contains('open');
  if(!modalOpen && state.tab!=='welcome') render();
}

function loadPersistedData(){
  if(!storageAvailable) return Promise.resolve();
  return migrateLegacyDataIfNeeded().then(()=>{
    return Promise.all([
      refs.findings.once('value').then(s=>{ state.findings=objMapToArray(s.val()).sort((a,b)=>b.createdAt-a.createdAt); }),
      refs.reports.once('value').then(s=>{ state.reports=objMapToArray(s.val()).sort((a,b)=>b.id-a.id); }),
      refs.checklists.once('value').then(s=>{ const d=s.val(); if(d) state.checklistsByFloor=d; }),
      refs.floorLastSubmitted.once('value').then(s=>{ state.floorLastSubmitted=s.val()||{}; }),
    ]).catch(e=>console.error('Failed to load audit data',e));
  }).then(()=>{
    if(!listenersAttached){
      subscribeToFindings();
      subscribeToReports();
      subscribeToChecklists();
      subscribeToFloorLastSubmitted();
      subscribeToUsers();
      subscribeToUserRoles();
      subscribeToActivityLog();
      subscribeToArchive();
      subscribeToTitleTemplates();
      subscribeToStaffByFloor();
      subscribeToPendingStaff();
      listenersAttached=true;
    }
  });
}

/* ---------- Presence: each signed-in user may write only their own lastSeen field (see Security Rules) ---------- */
let presenceInterval=null;
let presenceUid=null;                 // guards against re-arming when our own heartbeat write re-triggers the role listener
let presenceVisibilityHandlerAttached=false; // the visibilitychange listener is registered exactly once, ever
function startPresenceHeartbeat(uid){
  if(presenceUid===uid && presenceInterval) return; // already running for this session — do nothing
  presenceUid=uid;
  const beat=()=>{ if(presenceUid) refs.userRoles.child(presenceUid).child('lastSeen').set(Date.now()).catch(()=>{}); };
  beat();
  if(presenceInterval) clearInterval(presenceInterval);
  presenceInterval=setInterval(beat,120000);
  if(!presenceVisibilityHandlerAttached){
    presenceVisibilityHandlerAttached=true;
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') beat(); });
  }
}
function stopPresenceHeartbeat(){
  if(presenceInterval){ clearInterval(presenceInterval); presenceInterval=null; }
  presenceUid=null;
}

/* ---------- Prevent duplicate submissions ---------- */
async function runGuarded(btn, label, fn){
  if(!btn || btn.disabled) return;
  const original=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML=`${ICONS.refresh} ${label||'Saving...'}`;
  try{ await fn(); }
  finally{
    btn.disabled=false;
    btn.innerHTML=original;
  }
}
function compressImage(dataUrl, maxDim, quality){
  maxDim=maxDim||900; quality=quality||0.65;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      try{ resolve(canvas.toDataURL('image/jpeg',quality)); }
      catch(e){ resolve(dataUrl); }
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

/* ============================================================ HELPERS ============================================================ */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
function statusIcon(status){
  if(status==='good') return `<div class="status-icon status-good">${ICONS.check}</div>`;
  if(status==='issue') return `<div class="status-icon status-issue">${ICONS.x}</div>`;
  if(status==='warning') return `<div class="status-icon status-warning">${ICONS.alert}</div>`;
  return `<div class="status-icon status-unchecked"></div>`;
}
function itemFindings(item){
  const since=state.floorLastSubmitted[state.floor]||0;
  return state.findings.filter(f=>f.checklistItemId===item.id && f.createdAt>since);
}
function computeItemStatus(item){
  const attached=itemFindings(item);
  if(attached.length===0) return 'unchecked';
  if(attached.some(f=>f.severity==='High')) return 'issue';
  return 'warning';
}
function subLabel(item){
  if(item.status==='good') return `<div class="ci-sub good">No issues</div>`;
  const count=itemFindings(item).length;
  const label=count>0 ? `${count} finding${count>1?'s':''} attached` : 'Issue found';
  if(item.status==='issue') return `<div class="ci-sub issue">${label}</div>`;
  if(item.status==='warning') return `<div class="ci-sub warning">${label}</div>`;
  return `<div class="ci-sub unchecked">Not checked</div>`;
}
function sevColor(s){return s==='High'?'var(--red-500)':s==='Medium'?'var(--orange-500)':'#C79419';}
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function fmtDateShort(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateMMDDYY(d){
  const dt=new Date(d);
  if(isNaN(dt.getTime())) return d;
  const mm=String(dt.getMonth()+1).padStart(2,'0');
  const dd=String(dt.getDate()).padStart(2,'0');
  const yy=String(dt.getFullYear()).slice(-2);
  return `${mm}/${dd}/${yy}`;
}
function resolutionPillHTML(f){
  const s=f.resolutionStatus||'open';
  const label=s==='open'?'Open':s==='pending'?'Pending Verification':'Verified';
  return `<span class="resolution-pill ${s}">${label}</span>`;
}
function reportFindings(r){
  if(!r.findingIds) return [];
  return r.findingIds.map(id=>state.findings.find(f=>f.id===id)).filter(Boolean);
}
function computeDueInfo(f){
  if(f.resolutionStatus==='verified') return {label:'Completed',cls:'completed'};
  const offset=DUE_OFFSET_DAYS[f.severity]!==undefined?DUE_OFFSET_DAYS[f.severity]:3;
  const due=f.createdAt+offset*86400000;
  const dueDay=new Date(due); dueDay.setHours(0,0,0,0);
  const today=new Date(); today.setHours(0,0,0,0);
  if(dueDay.getTime()<today.getTime()) return {label:'Overdue',cls:'overdue'};
  if(dueDay.getTime()===today.getTime()) return {label:'Due Today',cls:'dueToday'};
  const daysLeft=Math.round((dueDay-today)/86400000);
  return {label:`Due in ${daysLeft}d`,cls:'upcoming'};
}
function dueBadgeHTML(f){
  const d=computeDueInfo(f);
  return `<span class="due-pill due-${d.cls}">${d.label}</span>`;
}
function findingCardStyle(f){
  return `border-left-color:${sevColor(f.severity)};`;
}
function findingDateLabel(ts){
  const d=new Date(ts); d.setHours(0,0,0,0);
  const today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.round((today-d)/86400000);
  const full=new Date(ts).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  if(diffDays===0) return `Today, ${full}`;
  if(diffDays===1) return `Yesterday, ${full}`;
  return full;
}
function findingCardHTML(f){
  return `
    <div class="card finding-card" style="${findingCardStyle(f)}" data-finding="${f.id}">
      <div class="finding-thumb" style="${f.photos.before?`background-image:url('${f.photos.before}');background-size:cover;background-position:center;`:`background:${f.color}`}"></div>
      <div class="finding-info">
        <div class="finding-title"><span class="sev-dot" style="background:${sevColor(f.severity)}"></span>${f.title}</div>
        <div class="finding-area">${f.area}${f.assignedTo?` · ${f.assignedTo}`:''}</div>
        <div class="finding-time">${f.time} ${resolutionPillHTML(f)} ${dueBadgeHTML(f)}</div>
      </div>
      <div class="sev-chip sev-${f.severity}">${f.severity}</div>
    </div>`;
}
function groupedFindingsHTML(list, emptyMsg){
  if(list.length===0) return `<div class="card"><div class="empty-mini">${emptyMsg||'No findings yet'}</div></div>`;
  let html=''; let lastLabel=null;
  list.forEach(f=>{
    const label=findingDateLabel(f.createdAt);
    if(label!==lastLabel){ html+=`<div class="date-group-label">${label}</div>`; lastLabel=label; }
    html+=findingCardHTML(f);
  });
  return html;
}
function findingHaystack(f){
  const dateStr=new Date(f.createdAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  return [f.findingNo,f.title,f.area,f.description,f.assignedTo,f.createdBy,f.floor,dateStr,f.severity,f.resolutionStatus]
    .filter(Boolean).join(' ').toLowerCase();
}
function getFilteredFindings(){
  let list=state.findings;
  const q=state.dashSearch.trim().toLowerCase();
  if(q) list=list.filter(f=>findingHaystack(f).includes(q));
  if(state.filterStatus!=='all') list=list.filter(f=>f.resolutionStatus===state.filterStatus);
  if(state.filterSeverity!=='all') list=list.filter(f=>f.severity===state.filterSeverity);
  if(state.filterFloor!=='all') list=list.filter(f=>f.floor===state.filterFloor);
  if(state.filterAssigned!=='all') list=list.filter(f=>(f.assignedTo||'')===state.filterAssigned);
  if(state.filterDate==='today'){
    const start=new Date(); start.setHours(0,0,0,0);
    list=list.filter(f=>f.createdAt>=start.getTime());
  } else if(state.filterDate==='week'){
    const now=new Date(); const day=now.getDay(); const diff=day===0?-6:1-day;
    const monday=new Date(now); monday.setDate(now.getDate()+diff); monday.setHours(0,0,0,0);
    list=list.filter(f=>f.createdAt>=monday.getTime());
  } else if(state.filterDate==='month'){
    const now=new Date(); const start=new Date(now.getFullYear(),now.getMonth(),1);
    list=list.filter(f=>f.createdAt>=start.getTime());
  } else if(state.filterDate==='overdue'){
    list=list.filter(f=>computeDueInfo(f).cls==='overdue');
  }
  return list;
}

function relativeTime(ts){
  const diff=Date.now()-ts;
  const mins=Math.floor(diff/60000);
  if(mins<1) return 'Just now';
  if(mins<60) return `${mins}m ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24) return `${hrs}h ago`;
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

    <div style="font-size:13.5px;color:var(--text-900);font-weight:600;line-height:1.5;margin-bottom:18px;">${message}</div>
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" id="confirmCancelBtn">Cancel</button>
      <button class="btn-primary" id="confirmOkBtn" style="flex:1;background:${danger?'var(--red-500)':'var(--green-600)'};">${confirmLabel||'Confirm'}</button>
    </div>
  `);
  document.getElementById('confirmCancelBtn').onclick=()=>closeModal();
  document.getElementById('confirmOkBtn').onclick=onConfirm;
}

/* ============================================================ HOME (kept for internal navigation only) ============================================================ */
function greetingWord(){
  const h=new Date().getHours();
  if(h<12) return 'Good Morning';
  if(h<17) return 'Good Afternoon';
  return 'Good Evening';
}
function statusDotColor(status){
  if(status==='good') return 'var(--green-600)';
  if(status==='issue') return 'var(--red-500)';
  if(status==='warning') return 'var(--orange-500)';
  return 'var(--text-400)';
}
function statusPillLabel(status){
  if(status==='good') return 'Good';
  if(status==='issue') return 'Critical';
  if(status==='warning') return 'Needs Attention';
  return 'Not Checked';
}

/* ============================================================ DAILY AUDIT TAB ============================================================ */
function renderAudit(){

function openDatePicker(){
  openModal(`
    <div class="modal-head"><h3>Select Audit Date</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="field-block"><input type="date" class="text-input" id="datePickInput" value="${state.auditDate}"></div>
    <button class="btn-primary" id="dateConfirm">Confirm Date</button>
  `);
  document.getElementById('dateConfirm').onclick=()=>{
    state.auditDate=document.getElementById('datePickInput').value||state.auditDate;
    closeModal();render();
  };
}

function openChecklistDetail(id){
  const item=getChecklist().find(c=>c.id===id);
  const attached=itemFindings(item);
  const computed=computeItemStatus(item);
  const computedLabel=computed==='unchecked'?'Not Checked Yet':computed==='issue'?'Critical':'Needs Attention';
  const computedClass=computed==='unchecked'?'pill-unchecked':computed==='issue'?'pill-issue':'pill-warning';
  const canEdit=state.role==='auditor' || state.role==='admin';
  openModal(`
    <div class="modal-head"><h3>${item.name}</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="row-between" style="margin-bottom:16px;"><span style="font-size:13px;font-weight:700;color:var(--text-600);">Status</span><span class="status-pill ${computedClass}" style="font-size:11.5px;">${computedLabel}</span></div>
    <button class="btn-primary" id="addFindingHereBtn" style="background:var(--orange-500);margin-bottom:16px;">${ICONS.wrench} Add Finding</button>
    <label class="field-label">Findings Attached (${attached.length})</label>
    <div style="margin-bottom:16px;">
      ${attached.length===0 ? `<div class="empty-mini" style="padding:8px 0;">No findings attached yet</div>` : attached.map(f=>`
        <div class="mini-finding" style="${findingCardStyle(f)}" data-finding="${f.id}">
          <div class="mini-thumb" style="${f.photos.before?`background-image:url('${f.photos.before}');background-size:cover;background-position:center;`:`background:${f.color}`}"></div>
          <div style="flex:1;min-width:0;"><div class="mini-finding-title">${f.title}</div><div class="mini-finding-sub">${resolutionPillHTML(f)} ${dueBadgeHTML(f)}</div></div>
          ${canEdit ? `<button class="admin-edit-btn" data-edit-finding="${f.id}">${ICONS.pencil}</button>` : ''}
        </div>`).join('')}
    </div>
    <button class="btn-primary" id="clSave">Save Status</button>
  `);
  document.querySelectorAll('.mini-finding').forEach(el=>{
    el.addEventListener('click',(e)=>{ if(e.target.closest('[data-edit-finding]')) return; openFindingDetail(parseInt(el.dataset.finding),()=>openChecklistDetail(item.id)); });
  });
  if(canEdit){
    document.querySelectorAll('[data-edit-finding]').forEach(btn=>{
      btn.onclick=(e)=>{e.stopPropagation();const f=state.findings.find(x=>x.id===parseInt(btn.dataset.editFinding));openAddFinding(item,f);};
    });
  }
  document.getElementById('addFindingHereBtn').onclick=()=>openAddFinding(item);
  document.getElementById('clSave').onclick=async()=>{
    item.status=computeItemStatus(item)==='unchecked' ? 'good' : computeItemStatus(item);
    const btn=document.getElementById('clSave');
    await runGuarded(btn,'Saving...',()=>saveChecklistsForFloor(state.floor,getChecklist()));
    closeModal();render();toast('Checklist updated');
  };
}

function openEditChecklistItem(id){
  const isNew = id===null;
  const list=getChecklist();
  const item = isNew ? {name:''} : list.find(c=>c.id===id);
  openModal(`
    <div class="modal-head"><h3>${isNew?'Add Checklist Item':'Edit Checklist Item'} — ${state.floor}</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="field-block"><label class="field-label">Item Name</label><input class="text-input" id="itemNameInput" value="${item.name}" placeholder="e.g. Loading Dock"></div>
    <button class="btn-primary" id="itemSaveBtn" style="margin-bottom:10px;">Save Item</button>
    ${!isNew?`<button class="btn-secondary" style="width:100%;color:var(--red-500);border-color:var(--red-050);" id="itemDeleteBtn">${ICONS.trash} Remove Item</button>`:''}
  `);
  document.getElementById('itemSaveBtn').onclick=async()=>{
    const name=document.getElementById('itemNameInput').value.trim();
    if(!name){toast('Please enter a name');return;}
    if(isNew){ list.push({id:nextId(),name,status:'unchecked'}); toast('Checklist item added to '+state.floor); }
    else { item.name=name; toast('Checklist item updated'); }
    const btn=document.getElementById('itemSaveBtn');
    await runGuarded(btn,'Saving...',()=>saveChecklistsForFloor(state.floor,list));
    logActivity('Checklist modified', `${isNew?'Added':'Renamed'} "${name}" on ${state.floor}`);
    closeModal();render();
  };
  if(!isNew){
    document.getElementById('itemDeleteBtn').onclick=async()=>{
      const newList=list.filter(c=>c.id!==id);
      setChecklist(newList);
      const btn=document.getElementById('itemDeleteBtn');
      await runGuarded(btn,'Removing...',()=>saveChecklistsForFloor(state.floor,newList));
      logActivity('Checklist modified', `Removed "${item.name}" from ${state.floor}`);
      closeModal();render();toast('Checklist item removed');
    };
  }
}

/* ---------- Submit Audit ---------- */
function submitAudit(){
  const checklist=getChecklist();
  const total=checklist.length;
  const completed=checklist.filter(c=>c.status!=='unchecked').length;
  const unchecked=total-completed;
  const since=state.floorLastSubmitted[state.floor]||0;
  const findingsForReport=state.findings.filter(f=>f.floor===state.floor && f.createdAt>since);

  openModal(`
    <div class="modal-head"><h3>Review Audit — ${state.floor}</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    ${unchecked>0 ? `<div class="lock-note" style="background:var(--orange-050);color:#8A5210;">${ICONS.info} ${unchecked} area${unchecked>1?'s':''} not yet checked. You can still submit.</div>` : ''}
    ${total===0 ? `<div class="lock-note" style="background:var(--orange-050);color:#8A5210;">${ICONS.info} No checklist items have been added yet for ${state.floor}.</div>` : ''}
    <div style="margin-bottom:16px;">
      ${checklist.map(item=>{
        const count=itemFindings(item).length;
        return `<div class="checklist-item" style="cursor:default;">${statusIcon(item.status)}<div style="flex:1;min-width:0;"><div class="ci-name">${item.name}</div><div class="ci-sub unchecked">${count>0?`${count} finding${count>1?'s':''} attached`:(item.status==='unchecked'?'Not checked':'No findings')}</div></div></div>`;
      }).join('')}
    </div>
    <div style="font-size:12.5px;color:var(--text-600);font-weight:600;margin-bottom:16px;">${findingsForReport.length} finding${findingsForReport.length===1?'':'s'} will be included in this report. Statuses and attached findings will reset for the next audit after you confirm.</div>
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" id="reviewCancelBtn">Cancel</button>
      <button class="btn-primary" id="reviewConfirmBtn" style="flex:1;background:var(--green-600);">${ICONS.check} Confirm &amp; Submit</button>
    </div>
  `);
  document.getElementById('reviewCancelBtn').onclick=()=>closeModal();
  document.getElementById('reviewConfirmBtn').onclick=async()=>{
    const newReport={
      id:Date.now(),
      date:fmtDateShort(state.auditDate),
      floor:state.floor,
      totalItems:total,
      completedItems:completed,
      checklistSnapshot:JSON.parse(JSON.stringify(checklist)),
      findingIds:findingsForReport.map(f=>f.id),
      findingsCount:findingsForReport.length,
      submittedBy:state.username||'Unknown',
    };
    state.reports.unshift(newReport);
    checklist.forEach(item=>{item.status='unchecked';});
    const submittedAt=Date.now();
    state.floorLastSubmitted[state.floor]=submittedAt;
    const btn=document.getElementById('reviewConfirmBtn');
    await runGuarded(btn,'Submitting...',()=>Promise.all([
      saveReport(newReport),
      saveChecklistsForFloor(state.floor,checklist),
      setFloorLastSubmitted(state.floor,submittedAt),
    ]));
    logActivity('Report submitted', `Audit submitted — ${newReport.date} — ${state.floor} (${newReport.findingsCount} findings)`);
    closeModal();
    toast('Audit submitted — checklist reset for next audit');
    render();
  };
}

/* ---------- Admin Tools: Pending Staff Approvals ---------- */

      <div class="card" style="cursor:default;">

        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" data-reject="${id}" style="color:var(--red-500);">${ICONS.x} Reject</button>

      </div>`).join('')}

  document.querySelectorAll('[data-approve]').forEach(btn=>{

      logActivity('User role changed', `Approved staff "${rec.name}" for ${rec.floor}`);

/* ---------- Admin Tools: User Management ---------- */
function openUserManagement(){
  const q=(document.getElementById('userSearchInput')?document.getElementById('userSearchInput').value:'').toLowerCase();
  const entries=Object.entries(state.userRoles||{}).filter(([uid,u])=>!q||(u.name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q))
    .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  const ONLINE_WINDOW_MS=5*60*1000;
  openModal(`
    <div class="modal-head"><h3>User Management</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="lock-note">${ICONS.info} Each person signs in with their own email + password. Role and access are enforced by the database itself, not just the app.</div>
    <div class="search-bar" style="margin-bottom:14px;">${ICONS.search}<input id="userSearchInput" placeholder="Search users..." value="${q}"></div>
    ${entries.length===0 ? `<div class="empty-mini">No users found</div>` : entries.map(([uid,u])=>{
      const online = u.lastSeen && (Date.now()-u.lastSeen)<ONLINE_WINDOW_MS;
      const isSelf = uid===state.uid;
      return `
      <div class="card" style="cursor:default;">
        <div class="row-between">
          <div><div style="font-weight:700;font-size:14.5px;">${u.name}${isSelf?' (you)':''}</div><div style="font-size:11.5px;color:var(--text-600);font-weight:600;">${u.email||''}</div></div>
          <span class="status-pill ${u.active===false?'pill-issue':'pill-good'}">${u.active===false?'Deactivated':online?'Online':'Active'}</span>
        </div>
        <div style="font-size:11px;color:var(--text-400);margin:8px 0 10px;">Last seen ${u.lastSeen?relativeTime(u.lastSeen):'Never'}</div>
        <select class="select-input" style="margin-bottom:8px;" data-role-select="${uid}" ${isSelf?'disabled':''}>
          <option value="auditor" ${u.role==='auditor'?'selected':''}>Auditor</option>
          <option value="resolver" ${u.role==='resolver'?'selected':''}>Resolver</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
        </select>
        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" style="flex:1;${u.active===false?'color:var(--green-600);':'color:var(--red-500);'}" data-toggle-user="${uid}" ${isSelf?'disabled':''}>${u.active===false?ICONS.check+' Reactivate':ICONS.x+' Deactivate'}</button>
          <button class="btn-secondary" style="flex:1;" data-reset-user="${uid}">${ICONS.lock} Reset PW</button>
          <button class="btn-secondary" style="flex:1;color:var(--red-500);" data-delete-user="${uid}" ${isSelf?'disabled':''}>${ICONS.trash}</button>
        </div>
      </div>`;}).join('')}
    <div class="field-block" style="margin-top:14px;"><label class="field-label">Create new user</label>
      <input class="text-input" id="newUserNameInput" placeholder="Full name" style="margin-bottom:8px;">
      <input class="text-input" id="newUserEmailInput" placeholder="Email address" type="email" style="margin-bottom:8px;">
      <input class="text-input" id="newUserPwInput" placeholder="Temporary password (min 6 chars)" type="text" style="margin-bottom:8px;">
      <select class="select-input" id="newUserRoleSel" style="margin-bottom:8px;">
        <option value="auditor">Auditor</option>
        <option value="resolver">Resolver</option>
        <option value="admin">Admin</option>
      </select>
      <button class="btn-secondary" style="width:100%;" id="addUserBtn">${ICONS.check} Create User</button>
    </div>
    <button class="btn-secondary" style="width:100%;margin-top:10px;" onclick="closeModal()">Close</button>
  `);
  const search=document.getElementById('userSearchInput');
  search.focus();
  search.setSelectionRange(search.value.length,search.value.length);
  search.oninput=()=>openUserManagement();
  document.querySelectorAll('[data-role-select]').forEach(sel=>{
    sel.onchange=async()=>{ await setUserRole(sel.dataset.roleSelect, sel.value); openUserManagement(); };
  });
  document.querySelectorAll('[data-toggle-user]').forEach(btn=>{
    btn.onclick=async()=>{
      const uid=btn.dataset.toggleUser;
      const u=state.userRoles[uid];
      await setUserActive(uid, u.active===false);
      openUserManagement();
    };
  });
  document.querySelectorAll('[data-reset-user]').forEach(btn=>{
    btn.onclick=async()=>{
      const uid=btn.dataset.resetUser;
      const u=state.userRoles[uid];
      if(u && u.email) await sendPasswordReset(u.email);
    };
  });
  document.querySelectorAll('[data-delete-user]').forEach(btn=>{
    btn.onclick=async()=>{
      const uid=btn.dataset.deleteUser;
      const u=state.userRoles[uid];
      if(!confirm(`Remove ${u.name}'s access? This removes their role record so they can no longer sign in. Their sign-in account itself must still be deleted from the Firebase Console (client apps can't delete other users' accounts).`)) return;
      await removeUserRecord(uid);
      openUserManagement();
    };
  });
  const addBtn=document.getElementById('addUserBtn');
  if(addBtn) addBtn.onclick=async()=>{
    const name=(document.getElementById('newUserNameInput').value||'').trim();
    const email=(document.getElementById('newUserEmailInput').value||'').trim();
    const pw=document.getElementById('newUserPwInput').value||'';
    const role=document.getElementById('newUserRoleSel').value;
    if(!name||!email||pw.length<6){ toast('Enter a name, email, and a password of at least 6 characters'); return; }
    addBtn.disabled=true; addBtn.textContent='Creating...';
    const ok=await createUserByAdmin(name,email,pw,role);
    addBtn.disabled=false; addBtn.textContent=ICONS.check+' Create User';
    if(ok){ toast('User created — share their email and temporary password with them'); openUserManagement(); }
  };
}

/* ---------- Admin Tools: Archive (soft-deleted findings & reports) ---------- */
function openArchive(){
  openModal(`
    <div class="modal-head"><h3>Archive</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="card-title">Archived Findings (${state.archivedFindings.length})</div>
    ${state.archivedFindings.length===0 ? `<div class="empty-mini" style="padding:8px 0;">None</div>` : state.archivedFindings.map(f=>`
      <div class="card" style="cursor:default;padding:12px;">
        <div class="row-between"><div style="font-weight:700;font-size:13.5px;">${f.title}</div><div class="sev-chip sev-${f.severity}">${f.severity}</div></div>
        <div style="font-size:11.5px;color:var(--text-600);margin:4px 0 8px;">${f.area} · Deleted by ${f.deletedBy} · ${relativeTime(f.deletedAt)}</div>
        <button class="btn-secondary" style="width:100%;color:var(--green-600);" data-restore-finding="${f.id}">${ICONS.check} Restore</button>
      </div>`).join('')}
    <div class="card-title" style="margin-top:16px;">Archived Reports (${state.archivedReports.length})</div>
    ${state.archivedReports.length===0 ? `<div class="empty-mini" style="padding:8px 0;">None</div>` : state.archivedReports.map(r=>`
      <div class="card" style="cursor:default;padding:12px;">
        <div style="font-weight:700;font-size:13.5px;">${r.date} — ${r.floor}</div>
        <div style="font-size:11.5px;color:var(--text-600);margin:4px 0 8px;">Deleted by ${r.deletedBy} · ${relativeTime(r.deletedAt)}</div>
        <button class="btn-secondary" style="width:100%;color:var(--green-600);" data-restore-report="${r.id}">${ICONS.check} Restore</button>
      </div>`).join('')}
    <button class="btn-secondary" style="width:100%;margin-top:6px;" onclick="closeModal()">Close</button>
  `);
  document.querySelectorAll('[data-restore-finding]').forEach(btn=>{
    btn.onclick=async()=>{
      const id=parseInt(btn.dataset.restoreFinding);
      await restoreFinding(id);
      logActivity('Finding edited', `Restored finding from archive (#${id})`);
      state.archivedFindings=state.archivedFindings.filter(f=>f.id!==id);
      toast('Finding restored');
      openArchive();
    };
  });
  document.querySelectorAll('[data-restore-report]').forEach(btn=>{
    btn.onclick=async()=>{
      const id=parseInt(btn.dataset.restoreReport);
      await restoreReport(id);
      logActivity('Report submitted', `Restored report from archive (#${id})`);
      state.archivedReports=state.archivedReports.filter(r=>r.id!==id);
      toast('Report restored');
      openArchive();
    };
  });
}

/* ---------- Add / Edit Finding ---------- */
let fPhotoData=null;
let sevSelected='High';
let fLockedItem=null;
let editingFindingId=null;
let fTitleSelected=null;
let fAssignedMode='select';
let fAssignedSelected='';
function openAddFinding(lockedItem, editFinding){
  fLockedItem=lockedItem||null;
  fAssignedMode='select';
  if(editFinding){
    editingFindingId=editFinding.id;
    sevSelected=editFinding.severity;
    fPhotoData=editFinding.photos.before||null;
    fTitleSelected=editFinding.title;
    fAssignedSelected=editFinding.assignedTo||'';
  } else {
    editingFindingId=null; sevSelected='High'; fPhotoData=null;
    fTitleSelected=null; fAssignedSelected='';
  }
  renderAddFindingModal();
}
function renderAddFindingModal(){
  const editingFinding=editingFindingId?state.findings.find(f=>f.id===editingFindingId):null;
  const descVal=document.getElementById('fDesc')?document.getElementById('fDesc').value:(editingFinding?editingFinding.description:'');
  const checklist=getChecklist();
  const titleVal=fTitleSelected || (editingFinding?editingFinding.title:'') || state.titleTemplates[0] || '';
  fTitleSelected=titleVal;
  const staffList=state.staffByFloor[state.floor]||[];
  const showCustomAssigned = fAssignedMode==='custom';
  openModal(`
    <div class="modal-head"><h3>${editingFinding?'Edit Finding':'Add Finding'}</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="field-block">
      <label class="field-label">Title</label>
      <select class="select-input" id="fTitle">
        ${state.titleTemplates.map(t=>`<option value="${t}" ${t===titleVal?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="field-block">
      <label class="field-label">Checklist / Area</label>
      ${fLockedItem
        ? `<div class="date-field" style="cursor:default;"><div>${fLockedItem.name}</div></div>`
        : checklist.length
          ? `<select class="select-input" id="fArea">${checklist.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>`
          : `<div class="lock-note">${ICONS.info} No checklist items exist for ${state.floor} yet.</div>`}
    </div>
    <div class="field-block">
      <label class="field-label">Severity</label>
      <div class="sev-picker" id="fSevPicker">
        <div class="sev-opt sel-High ${sevSelected==='High'?'selected':''}" data-s="High">High</div>
        <div class="sev-opt sel-Medium ${sevSelected==='Medium'?'selected':''}" data-s="Medium">Medium</div>
        <div class="sev-opt sel-Low ${sevSelected==='Low'?'selected':''}" data-s="Low">Low</div>
      </div>
    </div>
    <div class="field-block"><label class="field-label">Description</label><textarea class="text-input" id="fDesc" rows="3" placeholder="Describe the finding...">${descVal}</textarea></div>
    <div class="field-block">
      <label class="field-label">Assigned To (Optional) — ${state.floor}</label>
      ${!showCustomAssigned ? `
        <select class="select-input" id="fAssignedSelect">
          <option value="">Not assigned</option>
          ${staffList.map(n=>`<option value="${n}" ${n===fAssignedSelected?'selected':''}>${n}</option>`).join('')}
          <option value="__custom__">+ Type a new name...</option>
        </select>
      ` : `
        <input class="text-input" id="fAssignedCustom" placeholder="Type staff name" value="${fAssignedSelected||''}">
        <button class="link-btn" id="fAssignedBack" style="margin-top:6px;">${ICONS.chevronL} Back to list</button>
      `}
    </div>
    <div class="field-block">
      <label class="field-label">Photo (Optional)</label>
      <div class="upload-choice-row">
        <div class="upload-choice" id="takePhotoBtn">${ICONS.camera}Take Photo</div>
        <div class="upload-choice" id="choosePhotoBtn">${ICONS.image}Choose from Gallery</div>
      </div>
      <input type="file" id="fileInputCamera" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="fileInputGallery" accept="image/*" style="display:none;">
      <div class="preview-box">${fPhotoData?`<img src="${fPhotoData}"><button class="preview-remove" id="removePreview">${ICONS.x}</button>`:`<div class="empty-preview">${ICONS.image}<span>No photo selected</span></div>`}</div>
    </div>
    <button class="btn-primary" id="fReviewBtn">${ICONS.plus} Review Finding</button>
  `);
  document.getElementById('fTitle').onchange=(e)=>{ fTitleSelected=e.target.value; };
  document.querySelectorAll('#fSevPicker [data-s]').forEach(el=>{
    el.onclick=()=>{ sevSelected=el.dataset.s; document.querySelectorAll('#fSevPicker [data-s]').forEach(o=>o.classList.remove('selected')); el.classList.add('selected'); };
  });
  const assignedSelect=document.getElementById('fAssignedSelect');
  if(assignedSelect) assignedSelect.onchange=(e)=>{
    if(e.target.value==='__custom__'){ fAssignedMode='custom'; fAssignedSelected=''; renderAddFindingModal(); }
    else { fAssignedSelected=e.target.value; }
  };
  const assignedCustom=document.getElementById('fAssignedCustom');
  if(assignedCustom) assignedCustom.oninput=(e)=>{ fAssignedSelected=e.target.value; };
  const assignedBack=document.getElementById('fAssignedBack');
  if(assignedBack) assignedBack.onclick=()=>{ fAssignedMode='select'; fAssignedSelected=''; renderAddFindingModal(); };

  const fileInputCamera=document.getElementById('fileInputCamera');
  const fileInputGallery=document.getElementById('fileInputGallery');
  document.getElementById('takePhotoBtn').onclick=()=>fileInputCamera.click();
  document.getElementById('choosePhotoBtn').onclick=()=>fileInputGallery.click();
  const handlePhotoFile=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{fPhotoData=await compressImage(ev.target.result);renderAddFindingModal();};
    reader.readAsDataURL(file);
  };
  fileInputCamera.onchange=handlePhotoFile;
  fileInputGallery.onchange=handlePhotoFile;
  const rm=document.getElementById('removePreview');
  if(rm) rm.onclick=(e)=>{e.stopPropagation();fPhotoData=null;renderAddFindingModal();};

  document.getElementById('fReviewBtn').onclick=()=>{
    const title=document.getElementById('fTitle').value.trim();
    if(!title){toast('Please enter a title');return;}
    let targetItem=fLockedItem;
    if(!targetItem){
      const areaSelect=document.getElementById('fArea');
      if(!areaSelect){toast('Add a checklist item first');return;}
      targetItem=checklist.find(c=>c.id===parseInt(areaSelect.value));
    }
    const assignedTo=(fAssignedSelected||'').trim();
    const isNewStaffName = assignedTo && fAssignedMode==='custom' && !staffList.includes(assignedTo);
    const draft={
      title, area:targetItem.name, checklistItemId:targetItem.id,
      severity:sevSelected, description:document.getElementById('fDesc').value,
      assignedTo, isNewStaffName,
      photo:fPhotoData, editingFindingId,
    };
    openReviewFindingModal(draft);
  };
}

function openReviewFindingModal(draft){
  openModal(`
    <div class="modal-head"><h3>Review Finding</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="preview-box" style="${draft.photo?`background-image:url('${draft.photo}');background-size:cover;background-position:center;cursor:zoom-in;`:`background:#6b7688;`}margin-bottom:16px;" onclick="openImageViewer('${draft.photo?draft.photo.replace(/'/g,"\\'"):''}')"></div>
    <div class="row-between" style="margin-bottom:10px;"><span style="font-weight:600;color:var(--text-600);font-size:13.5px;">${draft.area}</span><div class="sev-chip sev-${draft.severity}">${draft.severity}</div></div>
    <div style="font-weight:700;font-size:15px;margin-bottom:6px;">${draft.title}</div>
    ${draft.description ? `<div style="font-size:13px;color:var(--text-900);margin-bottom:10px;line-height:1.45;">${draft.description}</div>` : ''}
    ${draft.assignedTo ? `<div style="font-size:12.5px;color:var(--text-600);font-weight:600;margin-bottom:14px;">Assigned to: ${draft.assignedTo}${draft.isNewStaffName?' (new — pending Admin approval to join the roster)':''}</div>` : ''}
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" id="reviewBackBtn">Edit</button>
      <button class="btn-primary" id="reviewConfirmAddBtn" style="flex:1;">${ICONS.check} Confirm &amp; Add</button>
    </div>
  `);
  document.getElementById('reviewBackBtn').onclick=()=>renderAddFindingModal();
  document.getElementById('reviewConfirmAddBtn').onclick=async()=>{
    let theFinding;
    if(draft.editingFindingId){
      theFinding=state.findings.find(x=>x.id===draft.editingFindingId);
      theFinding.title=draft.title; theFinding.area=draft.area; theFinding.checklistItemId=draft.checklistItemId;
      theFinding.severity=draft.severity; theFinding.description=draft.description; theFinding.assignedTo=draft.assignedTo;
      theFinding.photos.before=draft.photo; theFinding.updatedAt=Date.now();
    } else {
      const newId=nextId();
      const today=new Date();
      const findingNo=`FA-${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}-${String(newId).slice(-4)}`;
      theFinding={
        id:newId, findingNo, title:draft.title, description:draft.description,
        category:'', severity:draft.severity, floor:state.floor, area:draft.area,
        checklistItemId:draft.checklistItemId, assignedTo:draft.assignedTo,
        time:'Just now', color:'#6b7688',
        photos:{before:draft.photo, after:null},
        createdBy:state.username, createdAt:Date.now(), updatedAt:Date.now(),
        resolvedBy:'', resolvedAt:null, verifiedBy:'', verifiedAt:null,
        resolutionStatus:'open', actionPlan:'',
      };
      state.findings.unshift(theFinding);
    }
    if(draft.isNewStaffName){
      addPendingStaff(draft.assignedTo, state.floor, state.username);
      logActivity('Staff pending approval', `${draft.assignedTo} — ${state.floor}`);
    }
    fPhotoData=null;
    const returnItem=fLockedItem;
    editingFindingId=null; fLockedItem=null; fTitleSelected=null; fAssignedSelected=''; fAssignedMode='select';
    const btn=document.getElementById('reviewConfirmAddBtn');
    await runGuarded(btn,'Saving...',()=>saveFinding(theFinding));
    logActivity(draft.editingFindingId?'Finding edited':'Finding created', `${theFinding.findingNo||''} — ${theFinding.title} (${theFinding.area})`);
    render();
    toast(draft.editingFindingId?'Finding updated':'Finding added');
    if(returnItem) openChecklistDetail(returnItem.id); else closeModal();
  };
}

/* ---------- Finding detail + 3-state resolution ---------- */
function openFindingDetail(id, cameFrom){
  const f=state.findings.find(x=>x.id===id);
  const status=f.resolutionStatus||'open';
  const isAdmin=state.role==='admin';
  let body='';

  if(status==='open'){
    body = (state.role==='resolver'||isAdmin)
      ? `<button class="btn-primary" id="startResolveBtn" style="background:var(--orange-500);">${ICONS.wrench} Submit Resolution</button>`
      : `<div class="lock-note">${ICONS.info} Only resolvers can submit a resolution for this finding.</div>`;
  } else if(status==='pending'){
    body=`
      <div class="res-banner pending"><strong>Action Plan (by ${f.resolvedBy||'Unknown'}):</strong><br>${f.actionPlan||'—'}</div>
      ${(state.role==='auditor'||isAdmin)
        ? `<button class="btn-primary" id="verifyBtn" style="background:var(--green-600);">${ICONS.check} Verify &amp; Close</button>`
        : `<div class="lock-note">${ICONS.info} Awaiting auditor verification.</div>`}
    `;
  } else {
    body=`
      <div class="res-banner verified">${ICONS.check} Verified &amp; Closed by ${f.verifiedBy||'Unknown'}</div>
      ${f.actionPlan?`<div class="res-banner pending" style="margin-top:-4px;"><strong>Action Plan (by ${f.resolvedBy||'Unknown'}):</strong><br>${f.actionPlan}</div>`:''}
      ${(state.role==='auditor'||isAdmin) ? `<button class="btn-secondary" style="width:100%;margin-top:8px;" id="reopenBtn">Reopen Finding</button>` : ''}
    `;
  }

  const createdDate=new Date(f.createdAt).toLocaleDateString();
  const createdTime=new Date(f.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  openModal(`
    <div class="modal-head">
      <div><div style="font-size:11px;color:var(--text-400);font-weight:700;margin-bottom:2px;">${f.findingNo||''}</div><h3 style="margin:0;">${f.title}</h3></div>
      <button class="modal-close" onclick="closeModal()">${ICONS.x}</button>
    </div>

    <div class="before-after-row">
      <div class="ba-col">
        <div class="ba-label">Before</div>
        <div class="ba-box" style="${f.photos.before?'cursor:zoom-in;':''}" onclick="openImageViewer('${f.photos.before?f.photos.before.replace(/'/g,"\\'"):''}')">${f.photos.before?`<img src="${f.photos.before}">`:`<div class="ba-empty">No photo</div>`}</div>
      </div>
      <div class="ba-col">
        <div class="ba-label">After Repair</div>
        <div class="ba-box" style="${f.photos.after?'cursor:zoom-in;':''}" onclick="openImageViewer('${f.photos.after?f.photos.after.replace(/'/g,"\\'"):''}')">
          ${f.photos.after?`<img src="${f.photos.after}">`:`<div class="ba-empty">${f.resolutionStatus==='open'?'Not yet resolved':'No photo'}</div>`}
          ${f.resolutionStatus==='verified'?`<div class="verified-ribbon">${ICONS.check} Verified</div>`:''}
        </div>
      </div>
    </div>

    <div class="row-between" style="margin-bottom:10px;">
      <span style="font-weight:600;color:var(--text-600);font-size:13.5px;">${f.area}</span>
      <div style="display:flex;gap:6px;align-items:center;">${resolutionPillHTML(f)}${dueBadgeHTML(f)}<div class="sev-chip sev-${f.severity}">${f.severity}</div></div>
    </div>
    ${f.description ? `<div style="font-size:13px;color:var(--text-900);margin-bottom:10px;line-height:1.45;">${f.description}</div>` : ''}
    ${f.assignedTo ? `<div style="font-size:12.5px;color:var(--text-600);font-weight:600;margin-bottom:10px;">Assigned to: <strong>${f.assignedTo}</strong></div>` : ''}

    <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:16px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;color:#111827;">Audit History</div>
      <div style="font-size:12px;line-height:1.7;">
        <div><b>Created By:</b> ${f.createdBy||'Unknown'}</div>
        <div><b>Created:</b> ${createdDate} ${createdTime}</div>
        ${f.resolvedBy?`<hr style="margin:8px 0;border:none;border-top:1px solid #e5e7eb;"><div><b>Resolved By:</b> ${f.resolvedBy}</div><div><b>Resolved:</b> ${f.resolvedAt?new Date(f.resolvedAt).toLocaleString():'—'}</div>`:''}
        ${f.verifiedBy?`<hr style="margin:8px 0;border:none;border-top:1px solid #e5e7eb;"><div><b>Verified By:</b> ${f.verifiedBy}</div><div><b>Verified:</b> ${f.verifiedAt?new Date(f.verifiedAt).toLocaleString():'—'}</div>`:''}
      </div>
    </div>

    ${body}
    ${isAdmin ? `
      <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);">
        <div style="font-size:11px;font-weight:800;color:var(--red-500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">Admin Override</div>
        <label class="field-label">Force Resolution Status</label>
        <div class="sev-picker" id="adminForceStatus" style="margin-bottom:10px;">
          <div class="sev-opt ${status==='open'?'selected':''}" data-fs="open" style="${status==='open'?'border-color:var(--red-500);background:var(--red-050);color:var(--red-500);':''}">Open</div>
          <div class="sev-opt ${status==='pending'?'selected':''}" data-fs="pending" style="${status==='pending'?'border-color:var(--orange-500);background:var(--orange-050);color:var(--orange-500);':''}">Pending</div>
          <div class="sev-opt ${status==='verified'?'selected':''}" data-fs="verified" style="${status==='verified'?'border-color:var(--green-600);background:var(--green-050);color:var(--green-600);':''}">Verified</div>
        </div>
        <button class="btn-danger" id="deleteFindingBtn">${ICONS.trash} Archive Finding</button>
      </div>
    ` : ''}
    <button class="btn-secondary" style="width:100%;margin-top:10px;" id="findingDetailCloseBtn">${cameFrom?ICONS.chevronL+' Back':'Close'}</button>
  `);

  const startBtn=document.getElementById('startResolveBtn');
  if(startBtn) startBtn.onclick=()=>openResolveForm(f.id);
  const verifyBtn=document.getElementById('verifyBtn');
  if(verifyBtn) verifyBtn.onclick=async()=>{
    const patch={resolutionStatus:'verified', verifiedBy:state.username||'Unknown', verifiedAt:Date.now()};
    Object.assign(f,patch);
    await runGuarded(verifyBtn,'Verifying...',()=>updateFinding(f.id,patch));
    logActivity('Resolution verified', `${f.findingNo||''} — ${f.title}`);
    closeModal();render();toast('Finding verified & closed');
  };
  const reopenBtn=document.getElementById('reopenBtn');
  if(reopenBtn) reopenBtn.onclick=async()=>{
    const patch={resolutionStatus:'open', actionPlan:'', 'photos/after':null, resolvedBy:'', resolvedAt:null, verifiedBy:'', verifiedAt:null};
    f.resolutionStatus='open'; f.actionPlan=''; f.photos.after=null;
    f.resolvedBy=''; f.resolvedAt=null; f.verifiedBy=''; f.verifiedAt=null;
    await runGuarded(reopenBtn,'Reopening...',()=>updateFinding(f.id,patch));
    logActivity('Finding reopened', `${f.findingNo||''} — ${f.title}`);
    closeModal();render();toast('Finding reopened');
  };
  if(isAdmin){
    document.querySelectorAll('#adminForceStatus [data-fs]').forEach(el=>{
      el.onclick=async()=>{
        const newStatus=el.dataset.fs;
        if(newStatus===f.resolutionStatus) return;
        const patch={resolutionStatus:newStatus};
        if(newStatus==='verified'){ patch.verifiedBy=state.username||'Unknown'; patch.verifiedAt=Date.now(); }
        if(newStatus==='open'){ patch.actionPlan=''; patch['photos/after']=null; patch.resolvedBy=''; patch.resolvedAt=null; patch.verifiedBy=''; patch.verifiedAt=null; }
        Object.assign(f,patch);
        if(patch['photos/after']!==undefined) f.photos.after=null;
        await updateFinding(f.id,patch);
        logActivity('Admin override', `Forced ${f.findingNo||''} — ${f.title} to ${newStatus}`);
        closeModal();render();toast(`Status forced to ${newStatus}`);
      };
    });
    const deleteBtn=document.getElementById('deleteFindingBtn');
    if(deleteBtn) deleteBtn.onclick=()=>{
      openConfirmModal(`Archive "${f.title}"? It will be removed from active lists but can be restored later from the Archive.`,async()=>{
        const confirmBtn=document.getElementById('confirmOkBtn');
        await runGuarded(confirmBtn,'Archiving...',()=>archiveFinding(f,state.username));
        logActivity('Finding deleted', `${f.findingNo||''} — ${f.title} (archived)`);
        state.findings=state.findings.filter(x=>x.id!==f.id);
        closeModal();render();toast('Finding archived — restorable from Archive');
      },'Archive Finding',true);
    };
  }
  const closeBtn=document.getElementById('findingDetailCloseBtn');
  if(closeBtn) closeBtn.onclick=()=>{ if(cameFrom) cameFrom(); else closeModal(); };
}

let resolvePhotoData=null;
function openResolveForm(findingId){ resolvePhotoData=null; renderResolveForm(findingId); }
function renderResolveForm(findingId){
  const f=state.findings.find(x=>x.id===findingId);
  const planVal=document.getElementById('actionPlanInput')?document.getElementById('actionPlanInput').value:'';
  openModal(`
    <div class="modal-head"><div style="display:flex;align-items:center;gap:8px;"><button class="modal-close" id="resolveBackBtn">${ICONS.chevronL}</button><h3 style="margin:0;">Submit Resolution</h3></div><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="field-block"><label class="field-label">Action Plan</label><textarea class="text-input" id="actionPlanInput" rows="3" placeholder="What was done to fix this?">${planVal}</textarea></div>
    <div class="field-block">
      <label class="field-label">Proof Photo (After Repair)</label>
      <div class="upload-choice-row">
        <div class="upload-choice" id="takeResPhotoBtn">${ICONS.camera}Take Photo</div>
        <div class="upload-choice" id="chooseResPhotoBtn">${ICONS.image}Choose from Gallery</div>
      </div>
      <input type="file" id="resFileInputCamera" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="resFileInputGallery" accept="image/*" style="display:none;">
      <div class="preview-box">${resolvePhotoData?`<img src="${resolvePhotoData}"><button class="preview-remove" id="removeResPreview">${ICONS.x}</button>`:`<div class="empty-preview">${ICONS.image}<span>No photo selected</span></div>`}</div>
    </div>
    <button class="btn-primary" id="submitResolveBtn" style="background:var(--orange-500);">${ICONS.wrench} Submit for Verification</button>
  `);
  const resFileInputCamera=document.getElementById('resFileInputCamera');
  const resFileInputGallery=document.getElementById('resFileInputGallery');
  document.getElementById('takeResPhotoBtn').onclick=()=>resFileInputCamera.click();
  document.getElementById('chooseResPhotoBtn').onclick=()=>resFileInputGallery.click();
  const handleResPhotoFile=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{resolvePhotoData=await compressImage(ev.target.result);renderResolveForm(findingId);};
    reader.readAsDataURL(file);
  };
  resFileInputCamera.onchange=handleResPhotoFile;
  resFileInputGallery.onchange=handleResPhotoFile;
  const rm=document.getElementById('removeResPreview');
  if(rm) rm.onclick=(e)=>{e.stopPropagation();resolvePhotoData=null;renderResolveForm(findingId);};

  document.getElementById('submitResolveBtn').onclick=async()=>{
    const plan=document.getElementById('actionPlanInput').value.trim();
    if(!plan){toast('Please describe the action plan');return;}
    if(!resolvePhotoData){toast('Please attach a proof photo');return;}
    const patch={actionPlan:plan, 'photos/after':resolvePhotoData, resolvedBy:state.username||'Unknown', resolvedAt:Date.now(), resolutionStatus:'pending'};
    f.actionPlan=plan; f.photos.after=resolvePhotoData;
    f.resolvedBy=state.username||'Unknown'; f.resolvedAt=Date.now();
    f.resolutionStatus='pending';
    resolvePhotoData=null;
    const btn=document.getElementById('submitResolveBtn');
    await runGuarded(btn,'Submitting...',()=>updateFinding(f.id,patch));
    logActivity('Resolution submitted', `${f.findingNo||''} — ${f.title}`);
    closeModal();render();
    toast('Resolution submitted — awaiting auditor verification');
  };
}
