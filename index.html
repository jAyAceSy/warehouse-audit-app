/* ---------- Exports ---------- */
function getFilteredReports(){
  return state.reports.filter(r=>
    (state.exportDateFilter==='all' || r.date===state.exportDateFilter) &&
    (state.exportFloorFilter==='all' || r.floor===state.exportFloorFilter) &&
    (state.exportAuditorFilter==='all' || r.submittedBy===state.exportAuditorFilter)
  );
}
function getFilteredReportFindings(r){
  const findings=reportFindings(r);
  if(state.exportStatusFilter==='all') return findings;
  return findings.filter(f=>f.resolutionStatus===state.exportStatusFilter);
}
function exportFileSuffix(){
  const d=state.exportDateFilter==='all' ? '' : `_${state.exportDateFilter.replace(/[, ]+/g,'-')}`;
  const f=state.exportFloorFilter==='all' ? '' : `_${state.exportFloorFilter.replace(/\s+/g,'-')}`;
  const s=state.exportStatusFilter==='all' ? '' : `_${state.exportStatusFilter}`;
  const a=state.exportAuditorFilter==='all' ? '' : `_${state.exportAuditorFilter.replace(/\s+/g,'-')}`;
  return d+f+s+a;
}
function hasExportableData(){ return getFilteredReports().length>0; }
function exportReportCSV(){
  if(!hasExportableData()){toast('No reports match that filter');return;}
  let csv='Date,Submitted By,Warehouse/Area,Checklists,Title,Description,Image,Resolution,Action Plan,Image\n';
  getFilteredReports().forEach(r=>{
    const dateStr=fmtDateMMDDYY(r.date);
    const submitter=r.submittedBy||'Unknown';
    const findings=getFilteredReportFindings(r);
    if(findings.length===0){
      csv+=`"${dateStr}","${submitter}","${r.floor}","No findings logged in this audit",,,,,,\n`;
    }else{
      findings.forEach(f=>{
        const desc=(f.description||'').replace(/"/g,'""');
        const plan=(f.actionPlan||'').replace(/"/g,'""');
        const resLabel=f.resolutionStatus==='verified'?'Verified':f.resolutionStatus==='pending'?'Pending Verification':'Open';
        const img1=f.photos.before?'Photo attached':'No photo';
        const img2=f.photos.after?'Photo attached':'No photo';
        csv+=`"${dateStr}","${submitter}","${r.floor}","${f.area}","${f.title}","${desc}",${img1},${resLabel},"${plan}",${img2}\n`;
      });
    }
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`warehouse-audit-report${exportFileSuffix()}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity('Report exported', `CSV export${exportFileSuffix()||' (all)'}`);
  toast('Excel (CSV) file downloaded');
}
function detectImgFormat(dataUrl){
  if(!dataUrl) return null;
  const m=dataUrl.match(/^data:image\/(\w+);/);
  if(!m) return null;
  const type=m[1].toLowerCase();
  if(type==='jpeg'||type==='jpg') return 'JPEG';
  if(type==='png') return 'PNG';
  if(type==='webp') return 'WEBP';
  return null;
}
function exportReportPDF(){
  if(!hasExportableData()){toast('No reports match that filter');return;}
  if(!window.jspdf){toast('PDF library failed to load');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape'});
  const pageH=doc.internal.pageSize.getHeight();
  const marginX=10;
  // 0 Date | 1 Submitted By | 2 Warehouse/Area | 3 Checklists | 4 Title | 5 Description | 6 Image || 7 Resolution | 8 Action Plan | 9 Image
  const colW=[16,24,20,26,28,55,20, 18,38,20];
  const colX=[marginX];
  for(let i=0;i<colW.length-1;i++) colX.push(colX[i]+colW[i]);
  const tableW=colW.reduce((a,b)=>a+b,0);
  const orangeSpan=colW.slice(0,7).reduce((a,b)=>a+b,0);
  const greenSpan=colW.slice(7).reduce((a,b)=>a+b,0);

  function drawTableHeader(y){
    doc.setFillColor(239,139,59);
    doc.rect(colX[0],y,orangeSpan,6,'F');
    doc.setFillColor(29,154,98);
    doc.rect(colX[7],y,greenSpan,6,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text('Audit Findings',colX[0]+2,y+4.2);
    doc.text('Resolution',colX[7]+2,y+4.2);
    y+=6;
    const heads=['Date','Submitted By','Warehouse/Area','Checklists','Title','Description','Image','Resolution','Action Plan','Image'];
    doc.setFillColor(253,238,224); doc.rect(colX[0],y,orangeSpan,6,'F');
    doc.setFillColor(228,246,237); doc.rect(colX[7],y,greenSpan,6,'F');
    doc.setTextColor(20,24,43); doc.setFont('helvetica','bold'); doc.setFontSize(7);
    heads.forEach((h,i)=>doc.text(h,colX[i]+2,y+4.2));
    return y+6;
  }

  // Flatten every filtered report into one continuous list of rows (a placeholder row for audits with zero findings)
  const rows=[];
  getFilteredReports().forEach(r=>{
    const findings=getFilteredReportFindings(r);
    if(findings.length===0) rows.push({r,f:null});
    else findings.forEach(f=>rows.push({r,f}));
  });

  let y=14;
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(15,27,51);
  doc.text('Warehouse Audit Findings Report',marginX,y); y+=7;
  y=drawTableHeader(y);

  rows.forEach(({r,f})=>{
    const dateStr=fmtDateMMDDYY(r.date);
    if(!f){
      const rowH=8;
      if(y+rowH>pageH-12){ doc.addPage(); y=14; y=drawTableHeader(y); }
      doc.setDrawColor(225,230,240); doc.rect(colX[0],y,tableW,rowH);
      for(let i=1;i<colX.length;i++) doc.line(colX[i],y,colX[i],y+rowH);
      doc.setTextColor(18,24,43);doc.setFont('helvetica','normal');doc.setFontSize(6.5);
      doc.text(dateStr,colX[0]+2,y+5);
      doc.text(r.submittedBy||'Unknown',colX[1]+2,y+5,{maxWidth:colW[1]-4});
      doc.text(r.floor,colX[2]+2,y+5,{maxWidth:colW[2]-4});
      doc.setTextColor(90,100,120);
      doc.text('No findings logged in this audit',colX[3]+2,y+5,{maxWidth:colW[3]+colW[4]+colW[5]-4});
      y+=rowH;
      return;
    }
    doc.setFont('helvetica','normal').setFontSize(6.5);
    const descLines=doc.splitTextToSize(f.description||'—',colW[5]-4);
    const planLines=doc.splitTextToSize(f.actionPlan||'—',colW[8]-4);
    const titleLines=doc.splitTextToSize(f.title,colW[4]-4);
    const areaLines=doc.splitTextToSize(f.area,colW[3]-4);
    const maxLines=Math.max(descLines.length,planLines.length,titleLines.length,areaLines.length,1);
    const rowH=Math.max(maxLines*3.2+4,18);
    if(y+rowH>pageH-12){ doc.addPage(); y=14; y=drawTableHeader(y); }
    doc.setDrawColor(225,230,240); doc.rect(colX[0],y,tableW,rowH);
    for(let i=1;i<colX.length;i++) doc.line(colX[i],y,colX[i],y+rowH);
    doc.setTextColor(18,24,43);doc.setFont('helvetica','normal');doc.setFontSize(6.5);
    doc.text(dateStr,colX[0]+2,y+4.5);
    doc.text(r.submittedBy||'Unknown',colX[1]+2,y+4.5,{maxWidth:colW[1]-4});
    doc.text(r.floor,colX[2]+2,y+4.5,{maxWidth:colW[2]-4});
    doc.text(areaLines,colX[3]+2,y+4.5);
    doc.text(titleLines,colX[4]+2,y+4.5);
    doc.text(descLines,colX[5]+2,y+4.5);
    const fmt1=detectImgFormat(f.photos.before);
    if(fmt1){ try{ doc.addImage(f.photos.before,fmt1,colX[6]+2,y+2,colW[6]-4,Math.min(rowH-4,16)); } catch(e){ doc.text('Photo attached',colX[6]+2,y+4.5,{maxWidth:colW[6]-4}); } }
    else doc.text('No photo',colX[6]+2,y+4.5);
    const resLabel=f.resolutionStatus==='verified'?'Verified':f.resolutionStatus==='pending'?'Pending':'Open';
    doc.text(resLabel,colX[7]+2,y+4.5);
    doc.text(planLines,colX[8]+2,y+4.5);
    const fmt2=detectImgFormat(f.photos.after);
    if(fmt2){ try{ doc.addImage(f.photos.after,fmt2,colX[9]+2,y+2,colW[9]-4,Math.min(rowH-4,16)); } catch(e){ doc.text('Photo attached',colX[9]+2,y+4.5,{maxWidth:colW[9]-4}); } }
    else doc.text('No photo',colX[9]+2,y+4.5);
    y+=rowH;
  });
  doc.save(`warehouse-audit-report${exportFileSuffix()}.pdf`);
  logActivity('Report exported', `PDF export${exportFileSuffix()||' (all)'}`);
  toast('PDF downloaded');
}

/* ============================================================ DASHBOARD TAB ============================================================ */
let trendChartInstance=null;
function computeWeekdayTrend(){
  const dayLabels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const now=new Date();
  const dow=now.getDay();
  const mondayOffset= dow===0 ? -6 : 1-dow;
  const monday=new Date(now); monday.setDate(now.getDate()+mondayOffset); monday.setHours(0,0,0,0);
  const labels=[]; const counts=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(d.getDate()+i);
    const dEnd=new Date(d); dEnd.setDate(dEnd.getDate()+1);
    labels.push(dayLabels[d.getDay()]);
    counts.push(state.findings.filter(f=>f.createdAt>=d.getTime() && f.createdAt<dEnd.getTime()).length);
  }
  if(counts.every(c=>c===0) && state.findings.length>0){
    const labels2=[]; const counts2=[];
    const todayStart=new Date(); todayStart.setHours(0,0,0,0);
    for(let i=6;i>=0;i--){
      const d=new Date(todayStart); d.setDate(d.getDate()-i);
      const dEnd=new Date(d); dEnd.setDate(dEnd.getDate()+1);
      labels2.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
      counts2.push(state.findings.filter(f=>f.createdAt>=d.getTime() && f.createdAt<dEnd.getTime()).length);
    }
    return {labels:labels2,counts:counts2,fallback:true};
  }
  return {labels,counts,fallback:false};
}
function computeFloorTrend(){
  const counts={};
  FLOORS.forEach(f=>counts[f]=0);
  state.findings.forEach(f=>{ if(counts[f.floor]!==undefined) counts[f.floor]++; });
  return counts;
}
function computeKPIs(){
  const now=new Date();
  const todayStart=new Date(now); todayStart.setHours(0,0,0,0);
  const yestStart=new Date(todayStart); yestStart.setDate(yestStart.getDate()-1);
  const dow=now.getDay(); const mondayOffset=dow===0?-6:1-dow;
  const weekStart=new Date(now); weekStart.setDate(now.getDate()+mondayOffset); weekStart.setHours(0,0,0,0);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);

  const inRange=(f,start,end)=>f.createdAt>=start.getTime() && (!end || f.createdAt<end.getTime());
  const todayCount=state.findings.filter(f=>inRange(f,todayStart)).length;
  const yesterdayCount=state.findings.filter(f=>inRange(f,yestStart,todayStart)).length;
  const weekCount=state.findings.filter(f=>inRange(f,weekStart)).length;
  const monthCount=state.findings.filter(f=>inRange(f,monthStart)).length;
  const overdueCount=state.findings.filter(f=>computeDueInfo(f).cls==='overdue').length;

  const resolved=state.findings.filter(f=>f.resolvedAt);
  let avgResLabel='—';
  if(resolved.length){
    const avgMs=resolved.reduce((sum,f)=>sum+(f.resolvedAt-f.createdAt),0)/resolved.length;
    const hrs=avgMs/3600000;
    avgResLabel = hrs<24 ? `${hrs.toFixed(1)}h` : `${(hrs/24).toFixed(1)}d`;
  }

  const areaCounts={};
  state.findings.forEach(f=>{areaCounts[f.area]=(areaCounts[f.area]||0)+1;});
  const areaEntries=Object.entries(areaCounts).sort((a,b)=>b[1]-a[1]);
  const worstArea=areaEntries.length?areaEntries[0][0]:'—';
  const mostCommon=worstArea;

  let bestArea='—';
  const allItems=[];
  FLOORS.forEach(floor=>(state.checklistsByFloor[floor]||[]).forEach(item=>allItems.push(item.name)));
  const zeroFindingItems=allItems.filter(name=>!areaCounts[name]);
  if(zeroFindingItems.length) bestArea=zeroFindingItems[0];
  else if(areaEntries.length) bestArea=areaEntries[areaEntries.length-1][0];

  return {todayCount,yesterdayCount,weekCount,monthCount,overdueCount,avgResLabel,mostCommon,worstArea,bestArea};
}
function renderDashboard(){

  const kpi=computeKPIs();
  const trend=computeWeekdayTrend();

      <div class="ov-cell"><div class="ov-icon" style="background:var(--red-050);color:var(--red-500);">${ICONS.alert}</div><div><div class="ov-num">${open}<span style="font-size:11px;font-weight:700;color:var(--text-400);margin-left:4px;">${total?Math.round(open/total*100):0}%</span></div><div class="ov-lbl">Open Findings</div></div></div>
      <div class="ov-cell"><div class="ov-icon" style="background:var(--green-050);color:var(--green-600);">${ICONS.check}</div><div><div class="ov-num">${closed}<span style="font-size:11px;font-weight:700;color:var(--text-400);margin-left:4px;">${total?Math.round(closed/total*100):0}%</span></div><div class="ov-lbl">Closed Findings</div></div></div>
      <div class="ov-cell"><div class="ov-icon" style="background:var(--amber-050);color:#C79419;">${ICONS.alert}</div><div><div class="ov-num">${highSeverity}<span style="font-size:11px;font-weight:700;color:var(--text-400);margin-left:4px;">${total?Math.round(highSeverity/total*100):0}%</span></div><div class="ov-lbl">High Severity</div></div></div>
    </div>
  </div>

  <div class="card"><div class="card-title">Findings Over Time</div>
    <div class="stat-grid-4">
      <div><div class="num">${kpi.todayCount}</div><div class="lbl">Today</div></div>
      <div><div class="num">${kpi.yesterdayCount}</div><div class="lbl">Yesterday</div></div>
      <div><div class="num">${kpi.weekCount}</div><div class="lbl">This Week</div></div>
      <div><div class="num">${kpi.monthCount}</div><div class="lbl">This Month</div></div>
    </div>
  </div>

  <div class="card"><div class="card-title">Performance</div>
    <div class="kv-row"><span class="k">${ICONS.clock} Average Resolution Time</span><span class="v">${kpi.avgResLabel}</span></div>
    <div class="kv-row"><span class="k">${ICONS.alert} Overdue Findings</span><span class="v" style="color:${kpi.overdueCount>0?'var(--red-500)':'var(--green-600)'};">${kpi.overdueCount}</span></div>
    <div class="kv-row"><span class="k">Pending Verification</span><span class="v">${pendingVerification}</span></div>
    <div class="kv-row"><span class="k">Most Common Issue Area</span><span class="v">${kpi.mostCommon}</span></div>
    <div class="kv-row"><span class="k">Worst Area</span><span class="v">${kpi.worstArea}</span></div>
    <div class="kv-row"><span class="k">Best Area</span><span class="v">${kpi.bestArea}</span></div>
    ${state.role==='admin' ? `<div class="kv-row"><span class="k">${ICONS.check} Users Online (5 min)</span><span class="v" style="color:var(--green-600);">${onlineCount}</span></div>` : ''}
  </div>

  ${state.role==='admin' ? `
  <div class="card"><div class="card-title">Findings by Severity</div>
    <div class="area-bar-row"><div class="area-bar-label"><span>High</span><span>${highSeverity}</span></div><div class="area-bar-track"><div class="area-bar-fill" style="width:${total?Math.round(highSeverity/total*100):0}%;background:var(--red-500);"></div></div></div>
    <div class="area-bar-row"><div class="area-bar-label"><span>Medium</span><span>${medSeverity}</span></div><div class="area-bar-track"><div class="area-bar-fill" style="width:${total?Math.round(medSeverity/total*100):0}%;background:var(--orange-500);"></div></div></div>
    <div class="area-bar-row"><div class="area-bar-label"><span>Low</span><span>${lowSeverity}</span></div><div class="area-bar-track"><div class="area-bar-fill" style="width:${total?Math.round(lowSeverity/total*100):0}%;background:var(--amber-400);"></div></div></div>
  </div>` : ''}

  <div class="card"><div class="card-title">${trend.fallback?'Findings Trend (Last 7 Days)':'Findings Trend (This Week)'}</div><div style="height:150px;"><canvas id="trendChart"></canvas></div></div>

  <div class="card"><div class="card-title">Findings by Floor</div>
    ${(()=>{ const fc=computeFloorTrend(); const maxFc=Math.max(1,...Object.values(fc));
      return FLOORS.map(f=>`<div class="area-bar-row"><div class="area-bar-label"><span>${f}</span><span>${fc[f]}</span></div><div class="area-bar-track"><div class="area-bar-fill" style="width:${Math.round(fc[f]/maxFc*100)}%"></div></div></div>`).join('');
    })()}
  </div>

  <div class="card"><div class="card-title">Checklist Completion by Floor</div>
    ${FLOORS.map(floor=>{
      const list=state.checklistsByFloor[floor]||[];
      const t=list.length; const c=list.filter(x=>x.status!=='unchecked').length;

  </div>

  <div class="card"><div class="card-title">Findings by Area</div>
    ${areaEntries.length===0 ? `<div class="empty-mini" style="padding:6px 0;">No findings yet</div>` : areaEntries.map(([area,count])=>`
      <div class="area-bar-row"><div class="area-bar-label"><span>${area}</span><span>${count}</span></div><div class="area-bar-track"><div class="area-bar-fill" style="width:${Math.round((count/maxAreaCount)*100)}%"></div></div></div>`).join('')}
  </div>

  <div class="section-head"><h2>Recent Findings</h2></div>
  <div class="search-bar">${ICONS.search}<input id="dashSearchInput" placeholder="Search title, area, name, date..." value="${state.dashSearch}"></div>
  <div class="filter-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">

      <option value="open" ${state.filterStatus==='open'?'selected':''}>Open</option>
      <option value="pending" ${state.filterStatus==='pending'?'selected':''}>Pending Verification</option>
      <option value="verified" ${state.filterStatus==='verified'?'selected':''}>Verified</option>
    </select>
    <select class="select-input" id="filterSeveritySel">
      <option value="all" ${state.filterSeverity==='all'?'selected':''}>Severity: All</option>
      <option value="High" ${state.filterSeverity==='High'?'selected':''}>High</option>
      <option value="Medium" ${state.filterSeverity==='Medium'?'selected':''}>Medium</option>
      <option value="Low" ${state.filterSeverity==='Low'?'selected':''}>Low</option>
    </select>
    <select class="select-input" id="filterDateSel">
      <option value="all" ${state.filterDate==='all'?'selected':''}>Date: All</option>
      <option value="today" ${state.filterDate==='today'?'selected':''}>Today</option>
      <option value="week" ${state.filterDate==='week'?'selected':''}>This Week</option>
      <option value="month" ${state.filterDate==='month'?'selected':''}>This Month</option>
      <option value="overdue" ${state.filterDate==='overdue'?'selected':''}>Overdue</option>
    </select>
    <select class="select-input" id="filterFloorSel">
      <option value="all" ${state.filterFloor==='all'?'selected':''}>Floor: All</option>
      ${FLOORS.map(f=>`<option value="${f}" ${state.filterFloor===f?'selected':''}>${f}</option>`).join('')}
    </select>
    <select class="select-input" id="filterAssignedSel" style="grid-column:1 / -1;">
      <option value="all" ${state.filterAssigned==='all'?'selected':''}>Assigned To: All</option>
      ${assignedNames.map(n=>`<option value="${n}" ${state.filterAssigned===n?'selected':''}>${n}</option>`).join('')}
    </select>
  </div>

  ${groupedFindingsHTML(filtered, 'No findings match your search/filter')}
  `;

  document.querySelectorAll('.finding-card').forEach(c=>c.onclick=()=>openFindingDetail(parseInt(c.dataset.finding)));
  const searchInput=document.getElementById('dashSearchInput');
  searchInput.oninput=(e)=>{ state.dashSearch=e.target.value; renderDashboardFindingsOnly(); };
  document.getElementById('filterStatusSel').onchange=(e)=>{ state.filterStatus=e.target.value; renderDashboard(); };
  document.getElementById('filterSeveritySel').onchange=(e)=>{ state.filterSeverity=e.target.value; renderDashboard(); };
  document.getElementById('filterDateSel').onchange=(e)=>{ state.filterDate=e.target.value; renderDashboard(); };
  document.getElementById('filterFloorSel').onchange=(e)=>{ state.filterFloor=e.target.value; renderDashboard(); };
  document.getElementById('filterAssignedSel').onchange=(e)=>{ state.filterAssigned=e.target.value; renderDashboard(); };

  const ctx=document.getElementById('trendChart');
  if(trendChartInstance) trendChartInstance.destroy();
  trendChartInstance=new Chart(ctx,{
    type:'line',
    data:{ labels:trend.labels, datasets:[{ data:trend.counts, borderColor:'#2F5FE0', backgroundColor:'rgba(47,95,224,.08)', fill:true, tension:.35, pointRadius:3, pointBackgroundColor:'#2F5FE0', borderWidth:2.5 }] },

  });

function renderDashboardFindingsOnly(){
  const filtered=getFilteredFindings();
  const listEls=document.querySelectorAll('.content > .card.finding-card, .content > .empty-mini');
  // Simplest reliable approach: just re-render whole dashboard (search is infrequent typing, acceptable cost)
  renderDashboard();
  const input=document.getElementById('dashSearchInput');
  if(input){ input.value=state.dashSearch; input.focus(); input.setSelectionRange(input.value.length,input.value.length); }
}

/* ============================================================ NAV / RENDER LOOP ============================================================ */
document.querySelectorAll('.navitem').forEach(btn=>{ btn.addEventListener('click',()=>{ state.tab=btn.dataset.tab; render(); }); });

function render(){
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.tab===state.tab));
  const resolverFab=document.getElementById('resolverFab');
  if(state.tab==='welcome'){ renderWelcome(); resolverFab.style.display='none'; return; }
  document.getElementById('topbar').style.display='flex';
  document.getElementById('bottomNav').style.display='flex';
  document.getElementById('content').style.padding='16px 16px 96px';
  renderTopbar();
  if(state.tab==='audit') renderAudit();
  else if(state.tab==='reports') renderReports();
  else renderDashboard();
  resolverFab.style.display = state.role==='resolver' ? 'flex' : 'none';
  resolverFab.onclick=()=>openAddFinding();
}

(function init(){
  initFirebase();
  if(!storageAvailable){
    state.authChecking=false;
    render();
    setTimeout(()=>{ toast('Local-only mode — add Firebase config to sync devices'); },400);
    return;
  }
  initAuthListener(); // drives render() itself once auth state (and then role) resolves
  render(); // shows the "Loading…" screen while authChecking is true
})();
</script>
